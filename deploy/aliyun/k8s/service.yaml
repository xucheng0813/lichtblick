# ClusterIP Service：80 → 容器 8080（容器端口名 http，与 deployment 探针 port: http 对应）。
apiVersion: v1
kind: Service
metadata:
  name: lichtblick
  namespace: NAMESPACE_PLACEHOLDER
spec:
  type: ClusterIP
  selector:
    app: lichtblick
  ports:
    - name: http
      port: 80
      targetPort: http
